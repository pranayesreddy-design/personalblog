<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post | Krishna Pranay</title>
    <link rel="icon" type="image/png" href="./assets/images/favicon-astronaut.png?v=3" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <nav class="header-links" aria-label="Post navigation">
          <a class="back-link" href="./index.html">← Back to home</a>
        </nav>
        <p class="eyebrow">Section: <span data-post-section></span></p>
        <h1 data-post-title>Loading...</h1>
        <p class="tagline" data-post-summary></p>
        <p class="eyebrow" data-post-date></p>
      </div>
    </header>

    <main>
      <article class="container card post-body" data-post-body>
        <div class="post-flow" data-post-flow></div>
      </article>
      <section class="container">
        <p class="empty-state" data-post-error></p>
      </section>
    </main>

    <footer class="site-footer" data-shared-footer></footer>

    <script src="./assets/js/site-config.js"></script>
    <script src="./assets/js/shared-ui.js"></script>
    <script src="./assets/js/post.js"></script>
  </body>
</html>
